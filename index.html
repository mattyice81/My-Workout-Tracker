<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Command</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin-bottom: 2px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: block;
    }

    select, input, button {
      font-family: inherit;
    }

    select, input {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: #082f49; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover { border-color: var(--primary); }

    .btn-success {
      background: var(--accent);
      color: #052e16;
      width: 100%;
      padding: 12px;
    }
    .btn-success:hover { background: var(--accent-hover); }

    /* Builder tags */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 38px;
      padding: 8px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
    }

    .tag {
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-remove {
      color: var(--accent-danger);
      cursor: pointer;
      font-weight: bold;
    }

    /* Reference Card */
    .history-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
    }

    .history-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    /* Table */
    .logged-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .logged-table th {
      text-align: left;
      padding: 8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logged-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--accent-danger);
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- 1. User & Day Setup -->
    <div class="card">
      <div class="card-title">1. Profile & Date</div>
      <div class="grid-2">
        <div>
          <label>Active User</label>
          <div class="flex-row">
            <select id="userSelect"></select>
            <button class="btn btn-secondary" onclick="addNewUser()">+ User</button>
          </div>
        </div>
        <div>
          <label>Workout Date</label>
          <input type="date" id="targetDate" />
        </div>
      </div>
    </div>

    <!-- 2. Daily Workout Builder -->
    <div class="card">
      <div class="card-title">2. Build Today's Workout</div>
      <div class="grid-2">
        <div>
          <label>Workout Name</label>
          <input type="text" id="workoutNameInput" placeholder="e.g. Chest & Triceps" />
        </div>
        <div>
          <label>Add Exercise to Workout</label>
          <div class="flex-row">
            <input type="text" id="addExerciseInput" list="commonExercises" placeholder="Type or select exercise" />
            <datalist id="commonExercises">
              <option value="Bench Press"></option>
              <option value="Incline DB Press"></option>
              <option value="Squat"></option>
              <option value="Romanian Deadlift"></option>
              <option value="Lat Pulldown"></option>
              <option value="Barbell Row"></option>
              <option value="Overhead Press"></option>
              <option value="Bicep Curl"></option>
              <option value="Tricep Pushdown"></option>
            </datalist>
            <button class="btn btn-primary" onclick="addExerciseToRoutine()">Add</button>
          </div>
        </div>
      </div>
      <div>
        <label>Selected Routine for this Date</label>
        <div class="tag-container" id="routineTags"></div>
      </div>
    </div>

    <!-- 3. Logging Area -->
    <div class="card">
      <div class="card-title">3. Log Sets</div>
      <div>
        <label>Current Exercise</label>
        <select id="activeExerciseSelect"></select>
      </div>

      <!-- Prior Day Reference (Stops at Yesterday) -->
      <div class="history-card">
        <div class="history-header">
          <span style="color: var(--primary);">Prior Session (Previous Day)</span>
          <span style="color: var(--text-muted);" id="historyDateLabel">-</span>
        </div>
        <div class="history-list" id="historySetsContainer">
          <span style="color: var(--text-muted); font-size:0.85rem;">No prior session found.</span>
        </div>
      </div>

      <!-- Input Form -->
      <form onsubmit="event.preventDefault(); saveActiveSet();">
        <div class="grid-2">
          <div>
            <label>Weight (lbs/kg)</label>
            <input type="number" id="weightInput" step="any" required placeholder="185" />
          </div>
          <div>
            <label>Reps</label>
            <input type="number" id="repsInput" step="1" required placeholder="8" />
          </div>
        </div>
        <button type="submit" class="btn btn-success" style="margin-top: 12px;">Save Set</button>
      </form>
    </div>

    <!-- 4. Today's Completed Sets Table -->
    <div class="card">
      <div class="card-title" id="todayLogTitle">Sets Completed on Selected Date</div>
      <table class="logged-table">
        <thead>
          <tr>
            <th>Set</th>
            <th>Exercise</th>
            <th>Weight</th>
            <th>Reps</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="completedSetsBody"></tbody>
      </table>
    </div>

  </div>

  <script>
    const STORE_KEY = 'workout_engine_data_v3';

    const defaultState = {
      users: ['Alex', 'Sam'],
      activeUser: 'Alex',
      // Routines mapped by "userId_date" -> { name: string, exercises: [] }
      routines: {
        'Alex_2026-09-14': {
          name: 'Chest & Back',
          exercises: ['Bench Press', 'Barbell Row', 'Incline DB Press']
        }
      },
      // Completed sets
      sets: [
        { userId: 'Alex', date: '2026-09-10', exercise: 'Bench Press', weight: 185, reps: 8 },
        { userId: 'Alex', date: '2026-09-10', exercise: 'Bench Press', weight: 195, reps: 6 },
        { userId: 'Alex', date: '2026-09-10', exercise: 'Bench Press', weight: 205, reps: 5 }
      ]
    };

    function getState() {
      const data = localStorage.getItem(STORE_KEY);
      return data ? JSON.parse(data) : defaultState;
    }

    function saveState(state) {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    // Elements
    const userSelect = document.getElementById('userSelect');
    const targetDate = document.getElementById('targetDate');
    const workoutNameInput = document.getElementById('workoutNameInput');
    const addExerciseInput = document.getElementById('addExerciseInput');
    const routineTags = document.getElementById('routineTags');
    const activeExerciseSelect = document.getElementById('activeExerciseSelect');
    const historyDateLabel = document.getElementById('historyDateLabel');
    const historySetsContainer = document.getElementById('historySetsContainer');
    const weightInput = document.getElementById('weightInput');
    const repsInput = document.getElementById('repsInput');
    const completedSetsBody = document.getElementById('completedSetsBody');
    const todayLogTitle = document.getElementById('todayLogTitle');

    function init() {
      const state = getState();
      targetDate.value = new Date().toISOString().split('T')[0];
      renderUserDropdown(state);
      loadRoutineAndSets();
    }

    function renderUserDropdown(state) {
      userSelect.innerHTML = '';
      state.users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        if (u === state.activeUser) opt.selected = true;
        userSelect.appendChild(opt);
      });
    }

    function addNewUser() {
      const name = prompt('Enter new user profile name:');
      if (!name || !name.trim()) return;
      const clean = name.trim();
      const state = getState();
      if (!state.users.includes(clean)) state.users.push(clean);
      state.activeUser = clean;
      saveState(state);
      renderUserDropdown(state);
      loadRoutineAndSets();
    }

    function getRoutineKey() {
      const state = getState();
      return `${state.activeUser}_${targetDate.value}`;
    }

    function loadRoutineAndSets() {
      const state = getState();
      const key = getRoutineKey();
      const routine = state.routines[key] || { name: '', exercises: [] };

      // Update routine input fields
      workoutNameInput.value = routine.name || '';
      renderRoutineTags(routine.exercises);

      // Populate current exercise selector
      activeExerciseSelect.innerHTML = '';
      if (routine.exercises.length === 0) {
        const emptyOpt = document.createElement('option');
        emptyOpt.textContent = '-- Add an exercise to the routine above --';
        activeExerciseSelect.appendChild(emptyOpt);
      } else {
        routine.exercises.forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex;
          opt.textContent = ex;
          activeExerciseSelect.appendChild(opt);
        });
      }

      renderPriorDaySets();
      renderCurrentDaySets();
    }

    function renderRoutineTags(exercises) {
      routineTags.innerHTML = '';
      if (!exercises || exercises.length === 0) {
        routineTags.innerHTML = `<span style="color:var(--text-muted); font-size:0.85rem;">No exercises chosen yet.</span>`;
        return;
      }
      exercises.forEach((ex, idx) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `<span>${ex}</span><span class="tag-remove" onclick="removeExerciseFromRoutine(${idx})">&times;</span>`;
        routineTags.appendChild(tag);
      });
    }

    function addExerciseToRoutine() {
      const val = addExerciseInput.value.trim();
      if (!val) return;
      const state = getState();
      const key = getRoutineKey();

      if (!state.routines[key]) {
        state.routines[key] = { name: workoutNameInput.value.trim(), exercises: [] };
      }

      state.routines[key].name = workoutNameInput.value.trim();
      if (!state.routines[key].exercises.includes(val)) {
        state.routines[key].exercises.push(val);
      }

      saveState(state);
      addExerciseInput.value = '';
      loadRoutineAndSets();
    }

    function removeExerciseFromRoutine(index) {
      const state = getState();
      const key = getRoutineKey();
      if (state.routines[key]) {
        state.routines[key].exercises.splice(index, 1);
        saveState(state);
        loadRoutineAndSets();
      }
    }

    workoutNameInput.addEventListener('change', () => {
      const state = getState();
      const key = getRoutineKey();
      if (!state.routines[key]) {
        state.routines[key] = { name: '', exercises: [] };
      }
      state.routines[key].name = workoutNameInput.value.trim();
      saveState(state);
    });

    // Renders the last 3 sets from a date strictly BEFORE targetDate.value
    function renderPriorDaySets() {
      const state = getState();
      const user = state.activeUser;
      const curDate = targetDate.value;
      const selectedEx = activeExerciseSelect.value;

      historySetsContainer.innerHTML = '';

      if (!selectedEx || selectedEx.startsWith('--')) {
        historyDateLabel.textContent = '-';
        historySetsContainer.innerHTML = `<span style="color:var(--text-muted); font-size:0.85rem;">No exercise selected.</span>`;
        return;
      }

      // Filter sets belonging to this user & exercise, older than curDate
      const pastSets = state.sets.filter(s => s.userId === user && s.exercise === selectedEx && s.date < curDate);

      if (pastSets.length === 0) {
        historyDateLabel.textContent = 'None';
        historySetsContainer.innerHTML = `<span style="color:var(--text-muted); font-size:0.85rem;">No previous sessions found.</span>`;
        return;
      }

      // Find the most recent previous workout date
      const dates = [...new Set(pastSets.map(s => s.date))].sort().reverse();
      const lastSessionDate = dates[0];
      historyDateLabel.textContent = lastSessionDate;

      // Extract the sets from that single previous day, then take up to the last 3
      const lastSessionSets = pastSets.filter(s => s.date === lastSessionDate);
      const last3 = lastSessionSets.slice(-3);

      last3.forEach((set, i) => {
        const pill = document.createElement('div');
        pill.className = 'history-pill';
        pill.innerHTML = `<span style="color:var(--text-muted);">Set ${lastSessionSets.length - last3.length + i + 1}:</span> <strong>${set.weight}</strong> × <strong>${set.reps}</strong>`;
        historySetsContainer.appendChild(pill);
      });
    }

    // Save active set (does NOT clear inputs so you can see your data)
    function saveActiveSet() {
      const weight = parseFloat(weightInput.value);
      const reps = parseInt(repsInput.value, 10);
      const exercise = activeExerciseSelect.value;

      if (isNaN(weight) || isNaN(reps) || !exercise || exercise.startsWith('--')) return;

      const state = getState();
      state.sets.push({
        userId: state.activeUser,
        date: targetDate.value,
        exercise: exercise,
        weight: weight,
        reps: reps
      });

      saveState(state);
      renderCurrentDaySets();
      // Notice: weightInput.value and repsInput.value remain untouched
    }

    function renderCurrentDaySets() {
      const state = getState();
      const user = state.activeUser;
      const curDate = targetDate.value;

      todayLogTitle.textContent = `Completed Sets: ${curDate}`;
      completedSetsBody.innerHTML = '';

      const daySets = state.sets.filter(s => s.userId === user && s.date === curDate);

      if (daySets.length === 0) {
        completedSetsBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No sets logged for this date.</td></tr>`;
        return;
      }

      daySets.forEach((set, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${set.exercise}</td>
          <td>${set.weight}</td>
          <td>${set.reps}</td>
          <td style="text-align: right;">
            <button class="btn-delete" onclick="deleteSetByIndex(${idx})">Delete</button>
          </td>
        `;
        completedSetsBody.appendChild(tr);
      });
    }

    function deleteSetByIndex(dayIndex) {
      const state = getState();
      const user = state.activeUser;
      const curDate = targetDate.value;

      let matchCount = 0;
      const globalIndex = state.sets.findIndex(s => {
        if (s.userId === user && s.date === curDate) {
          if (matchCount === dayIndex) return true;
          matchCount++;
        }
        return false;
      });

      if (globalIndex > -1) {
        state.sets.splice(globalIndex, 1);
        saveState(state);
        renderCurrentDaySets();
      }
    }

    // Event hooks
    userSelect.addEventListener('change', () => {
      const state = getState();
      state.activeUser = userSelect.value;
      saveState(state);
      loadRoutineAndSets();
    });

    targetDate.addEventListener('change', loadRoutineAndSets);
    activeExerciseSelect.addEventListener('change', renderPriorDaySets);

    init();
  </script>
</body>
</html>
