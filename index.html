<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Workout Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    select, input, button {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .exercise-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .exercise-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }

    .last-history {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .sets-table {
      width: 100%;
      border-collapse: collapse;
    }

    .sets-table th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 6px 4px;
    }

    .sets-table td {
      padding: 4px;
    }

    .sets-table input {
      width: 100%;
      padding: 6px 8px;
    }

    .save-bar {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .save-day-btn {
      background-color: var(--success);
      color: #052e16;
      padding: 12px 24px;
      font-size: 16px;
      width: 100%;
    }

    .save-day-btn:hover {
      background-color: #16a34a;
    }

    /* Routine Manager Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border);
    }

    .modal-content textarea {
      width: 100%;
      height: 120px;
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Workout Log</h1>
      <div class="header-controls">
        <label for="userSelect">User:</label>
        <select id="userSelect"></select>
        <button class="btn-secondary" id="addUserBtn">+ User</button>

        <label for="routineSelect" style="margin-left: 10px;">Workout Day:</label>
        <select id="routineSelect"></select>
        <button class="btn-secondary" id="editRoutineBtn">Edit Routine</button>
      </div>
    </header>

    <main id="exerciseListContainer" style="display: flex; flex-direction: column; gap: 16px;"></main>

    <div class="save-bar">
      <button class="save-day-btn" id="saveDayBtn">Save Workout for the Day</button>
    </div>
  </div>

  <!-- Routine Customization Modal -->
  <div id="routineModal" class="modal">
    <div class="modal-content">
      <h3>Manage Routines</h3>
      <div>
        <label>Workout / Routine Name:</label>
        <input type="text" id="modalRoutineName" placeholder="e.g., Push Day or Leg Day" style="width: 100%; margin-top: 4px;" />
      </div>
      <div>
        <label>Exercises (one per line):</label>
        <textarea id="modalRoutineExercises" placeholder="Bench Press&#10;Overhead Press&#10;Incline Dumbbell Press"></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn-secondary" id="closeModalBtn">Cancel</button>
        <button id="saveRoutineBtn">Save Routine</button>
      </div>
    </div>
  </div>

  <script>
    // Primary State Schema
    const STORAGE_KEY = "workout_tracker_data";

    const defaultState = {
      currentUser: "Athlete",
      users: {
        "Athlete": {
          routines: {
            "Full Body": ["Barbell Squat", "Bench Press", "Bent-Over Row", "Overhead Press"]
          },
          currentRoutine: "Full Body",
          activeDraft: {}, // stores today's uncommitted sets: { exercise: [ {weight, reps, notes}, ... ] }
          archives: []     // stores completed sessions: [ { date: "YYYY-MM-DD", exercise: string, sets: [] } ]
        }
      }
    };

    let appState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function getUserData() {
      return appState.users[appState.currentUser];
    }

    // UI Elements
    const userSelect = document.getElementById("userSelect");
    const addUserBtn = document.getElementById("addUserBtn");
    const routineSelect = document.getElementById("routineSelect");
    const editRoutineBtn = document.getElementById("editRoutineBtn");
    const exerciseListContainer = document.getElementById("exerciseListContainer");
    const saveDayBtn = document.getElementById("saveDayBtn");

    const routineModal = document.getElementById("routineModal");
    const modalRoutineName = document.getElementById("modalRoutineName");
    const modalRoutineExercises = document.getElementById("modalRoutineExercises");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const saveRoutineBtn = document.getElementById("saveRoutineBtn");

    function init() {
      populateUsers();
      populateRoutines();
      renderExercises();
    }

    function populateUsers() {
      userSelect.innerHTML = "";
      Object.keys(appState.users).forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        if (u === appState.currentUser) opt.selected = true;
        userSelect.appendChild(opt);
      });
    }

    function populateRoutines() {
      routineSelect.innerHTML = "";
      const user = getUserData();
      const routineNames = Object.keys(user.routines);

      routineNames.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r;
        opt.textContent = r;
        if (r === user.currentRoutine) opt.selected = true;
        routineSelect.appendChild(opt);
      });
    }

    function getHistoricalReference(exerciseName) {
      const user = getUserData();
      const todayISO = new Date().toISOString().split("T")[0];

      // Filter entries strictly before today
      const pastSessions = user.archives
        .filter(item => item.exercise === exerciseName && item.date < todayISO)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      if (pastSessions.length === 0) return null;

      const last = pastSessions[0];
      // Display up to the first 3 recorded sets from that session
      const top3 = (last.sets || [])
        .slice(0, 3)
        .filter(s => s && (s.weight || s.reps))
        .map((s, idx) => `S${idx + 1}: ${s.weight \vert{}\vert{} 0} lbs × ${s.reps || 0}`)
        .join(" | ");

      return {
        date: last.date,
        summary: top3 || "No set data recorded"
      };
    }

    function renderExercises() {
      exerciseListContainer.innerHTML = "";
      const user = getUserData();
      const currentExercises = user.routines[user.currentRoutine] || [];

      if (currentExercises.length === 0) {
        exerciseListContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">No exercises configured for this routine. Click "Edit Routine" to add some.</div>`;
        return;
      }

      currentExercises.forEach(exercise => {
        const card = document.createElement("div");
        card.className = "exercise-card";

        const history = getHistoricalReference(exercise);
        const historyText = history 
          ? `Last performed (${history.date}):${history.summary}` 
          : "Last performed: No previous recorded history";

        let setsRows = "";
        const draftSets = (user.activeDraft && user.activeDraft[exercise]) || [];

        for (let i = 0; i < 4; i++) {
          const s = draftSets[i] || { weight: "", reps: "", notes: "" };
          setsRows += `
            <tr>
              <td style="font-weight: 600; width: 45px; text-align: center;">#${i + 1}</td>
              <td style="width: 25%;">
                <input type="number" step="any" placeholder="lbs" value="${s.weight}" 
                  oninput="updateDraft('${exercise}',${i}, 'weight', this.value)" />
              </td>
              <td style="width: 25%;">
                <input type="number" placeholder="reps" value="${s.reps}" 
                  oninput="updateDraft('${exercise}',${i}, 'reps', this.value)" />
              </td>
              <td>
                <input type="text" placeholder="e.g., RPE 8, tempo" value="${s.notes}" 
                  oninput="updateDraft('${exercise}',${i}, 'notes', this.value)" />
              </td>
            </tr>
          `;
        }

        card.innerHTML = `
          <div class="exercise-header">
            <span class="exercise-title">${exercise}</span>
          </div>
          <div class="last-history">${historyText}</div>
          <table class="sets-table">
            <thead>
              <tr>
                <th style="text-align: center;">Set</th>
                <th>Weight</th>
                <th>Reps</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              ${setsRows}
            </tbody>
          </table>
        `;

        exerciseListContainer.appendChild(card);
      });
    }

    // Auto-save active inputs
    window.updateDraft = function(exercise, setIndex, field, value) {
      const user = getUserData();
      if (!user.activeDraft) user.activeDraft = {};
      if (!user.activeDraft[exercise]) {
        user.activeDraft[exercise] = [{}, {}, {}, {}];
      }
      while (user.activeDraft[exercise].length < 4) {
        user.activeDraft[exercise].push({});
      }

      user.activeDraft[exercise][setIndex][field] = value;
      saveState();
    };

    // User switching & addition
    userSelect.addEventListener("change", (e) => {
      appState.currentUser = e.target.value;
      saveState();
      populateRoutines();
      renderExercises();
    });

    addUserBtn.addEventListener("click", () => {
      const name = prompt("Enter new user name:");
      if (name && !appState.users[name]) {
        appState.users[name] = {
          routines: { "Default": ["Squat", "Bench Press", "Deadlift"] },
          currentRoutine: "Default",
          activeDraft: {},
          archives: []
        };
        appState.currentUser = name;
        saveState();
        populateUsers();
        populateRoutines();
        renderExercises();
      }
    });

    // Routine selection & editing
    routineSelect.addEventListener("change", (e) => {
      const user = getUserData();
      user.currentRoutine = e.target.value;
      saveState();
      renderExercises();
    });

    editRoutineBtn.addEventListener("click", () => {
      const user = getUserData();
      modalRoutineName.value = user.currentRoutine || "";
      modalRoutineExercises.value = (user.routines[user.currentRoutine] || []).join("\n");
      routineModal.style.display = "flex";
    });

    closeModalBtn.addEventListener("click", () => {
      routineModal.style.display = "none";
    });

    saveRoutineBtn.addEventListener("click", () => {
      const name = modalRoutineName.value.trim();
      const exercises = modalRoutineExercises.value
        .split("\n")
        .map(e => e.trim())
        .filter(e => e.length > 0);

      if (!name) {
        alert("Routine name cannot be empty.");
        return;
      }

      const user = getUserData();
      user.routines[name] = exercises;
      user.currentRoutine = name;
      saveState();

      routineModal.style.display = "none";
      populateRoutines();
      renderExercises();
    });

    // Archive Today's Workout
    saveDayBtn.addEventListener("click", () => {
      const user = getUserData();
      const currentExercises = user.routines[user.currentRoutine] || [];
      const todayISO = new Date().toISOString().split("T")[0];

      let recordedAny = false;

      currentExercises.forEach(exercise => {
        const sets = (user.activeDraft && user.activeDraft[exercise]) || [];
        const validSets = sets.filter(s => s && (s.weight || s.reps || s.notes));

        if (validSets.length > 0) {
          recordedAny = true;
          // Append entry to archives
          user.archives.push({
            date: todayISO,
            exercise: exercise,
            sets: JSON.parse(JSON.stringify(sets))
          });
          // Clear active draft for this exercise
          delete user.activeDraft[exercise];
        }
      });

      if (!recordedAny) {
        alert("No entries found to save for today.");
        return;
      }

      saveState();
      renderExercises();
      alert("Workout successfully saved to archive!");
    });

    // Start App
    init();
  </script>
</body>
</html>
