<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Command</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .date-display {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    /* History Reference Section (Previous Day Only) */
    .history-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .history-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    .history-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .history-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .history-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-pill .set-tag {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .no-history {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Logging Inputs */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-save {
      background: var(--accent);
      color: #052e16;
      border: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    .btn-save:hover {
      background: var(--accent-hover);
    }

    /* Today's Sets Logged */
    .logged-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .logged-table th {
      text-align: left;
      padding: 8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logged-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--accent-danger);
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>Workout Command</h1>
        <span class="date-display" id="currentDateDisplay"></span>
      </div>
    </header>

    <!-- Main Workout Entry Card -->
    <div class="card">
      <div>
        <label for="exerciseSelect">Exercise</label>
        <select id="exerciseSelect">
          <option value="Bench Press">Bench Press</option>
          <option value="Barbell Squat">Barbell Squat</option>
          <option value="Deadlift">Deadlift</option>
          <option value="Overhead Press">Overhead Press</option>
          <option value="Pull-ups">Pull-ups</option>
        </select>
      </div>

      <!-- Reference: Prior Workout Last 3 Sets -->
      <div class="history-card">
        <div class="history-header">
          <span class="history-title">Last Session (Previous Day)</span>
          <span class="history-date" id="historyDate">-</span>
        </div>
        <div class="history-list" id="historyList">
          <span class="no-history">No previous sessions found.</span>
        </div>
      </div>

      <!-- Set Logging Inputs -->
      <form id="setForm" onsubmit="event.preventDefault(); saveSet();">
        <div class="input-grid">
          <div>
            <label for="weightInput">Weight (lbs/kg)</label>
            <input type="number" id="weightInput" step="any" required placeholder="e.g. 185" />
          </div>
          <div>
            <label for="repsInput">Reps</label>
            <input type="number" id="repsInput" step="1" required placeholder="e.g. 8" />
          </div>
        </div>

        <button type="submit" class="btn-save" style="margin-top: 14px;">Save Set</button>
      </form>
    </div>

    <!-- Today's Logged Sets for current exercise -->
    <div class="card">
      <h2 style="font-size: 1.1rem; font-weight: 600;">Today's Completed Sets</h2>
      <table class="logged-table">
        <thead>
          <tr>
            <th>Set</th>
            <th>Weight</th>
            <th>Reps</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="todaySetsTableBody">
          <!-- Rows will be injected dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Local date string in YYYY-MM-DD format
    function getTodayString() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }

    // Seed dummy history if none exists to test the "previous day" feature right away
    function seedSampleData() {
      if (!localStorage.getItem('workout_command_history')) {
        const sampleHistory = [
          {
            date: "2024-01-10",
            exercise: "Bench Press",
            sets: [
              { weight: 185, reps: 8 },
              { weight: 195, reps: 6 },
              { weight: 205, reps: 5 },
              { weight: 205, reps: 4 }
            ]
          }
        ];
        localStorage.setItem('workout_command_history', JSON.stringify(sampleHistory));
      }
    }

    function getAllHistory() {
      return JSON.parse(localStorage.getItem('workout_command_history') || '[]');
    }

    function saveAllHistory(history) {
      localStorage.setItem('workout_command_history', JSON.stringify(history));
    }

    const exerciseSelect = document.getElementById('exerciseSelect');
    const weightInput = document.getElementById('weightInput');
    const repsInput = document.getElementById('repsInput');
    const historyDate = document.getElementById('historyDate');
    const historyList = document.getElementById('historyList');
    const todayTableBody = document.getElementById('todaySetsTableBody');
    const currentDateDisplay = document.getElementById('currentDateDisplay');

    // Display current date in header
    currentDateDisplay.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    });

    // Load and show the last 3 sets from a previous day (excludes today)
    function renderPreviousSessionSets(exerciseName) {
      const today = getTodayString();
      const allHistory = getAllHistory();

      // Find sessions for this exercise on dates strictly PRIOR to today
      const pastSessions = allHistory
        .filter(entry => entry.exercise === exerciseName && entry.date < today && entry.sets && entry.sets.length > 0)
        .sort((a, b) => new Date(b.date) - new Date(a.date)); // newest first

      historyList.innerHTML = '';

      if (pastSessions.length === 0) {
        historyDate.textContent = 'None';
        historyList.innerHTML = '<span class="no-history">No past session records found.</span>';
        return;
      }

      const mostRecentSession = pastSessions[0];
      historyDate.textContent = mostRecentSession.date;

      // Slice the last 3 sets of that workout
      const lastThreeSets = mostRecentSession.sets.slice(-3);

      lastThreeSets.forEach((set, idx) => {
        const pill = document.createElement('div');
        pill.className = 'history-pill';
        pill.innerHTML = `
          <span class="set-tag">Set ${mostRecentSession.sets.length - lastThreeSets.length + idx + 1}:</span>
          <strong>${set.weight}</strong> × <strong>${set.reps}</strong>
        `;
        historyList.appendChild(pill);
      });
    }

    // Render today's sets
    function renderTodaySets(exerciseName) {
      const today = getTodayString();
      const allHistory = getAllHistory();
      const todaySession = allHistory.find(h => h.date === today && h.exercise === exerciseName);

      todayTableBody.innerHTML = '';

      if (!todaySession || todaySession.sets.length === 0) {
        todayTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No sets recorded today.</td></tr>`;
        return;
      }

      todaySession.sets.forEach((set, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>Set ${index + 1}</td>
          <td>${set.weight}</td>
          <td>${set.reps}</td>
          <td style="text-align: right;">
            <button class="btn-delete" onclick="deleteSet(${index})">Remove</button>
          </td>
        `;
        todayTableBody.appendChild(tr);
      });
    }

    // Save set action
    function saveSet() {
      const weight = parseFloat(weightInput.value);
      const reps = parseInt(repsInput.value, 10);
      const exercise = exerciseSelect.value;
      const today = getTodayString();

      if (isNaN(weight) || isNaN(reps)) return;

      const history = getAllHistory();
      let session = history.find(entry => entry.date === today && entry.exercise === exercise);

      if (!session) {
        session = { date: today, exercise: exercise, sets: [] };
        history.push(session);
      }

      session.sets.push({ weight, reps });
      saveAllHistory(history);

      // Refresh today's list
      renderTodaySets(exercise);

      // NOTE: We deliberately DO NOT reset weightInput.value or repsInput.value
      // so your logged values stay visible and ready for the next set.
    }

    // Delete a logged set from today
    function deleteSet(index) {
      const today = getTodayString();
      const exercise = exerciseSelect.value;
      const history = getAllHistory();
      const session = history.find(entry => entry.date === today && entry.exercise === exercise);

      if (session) {
        session.sets.splice(index, 1);
        saveAllHistory(history);
        renderTodaySets(exercise);
      }
    }

    // Switch exercise
    exerciseSelect.addEventListener('change', () => {
      const ex = exerciseSelect.value;
      renderPreviousSessionSets(ex);
      renderTodaySets(ex);
    });

    // Initialization
    seedSampleData();
    renderPreviousSessionSets(exerciseSelect.value);
    renderTodaySets(exerciseSelect.value);
  </script>
</body>
</html>
